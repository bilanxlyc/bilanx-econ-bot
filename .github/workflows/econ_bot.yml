name: 경제지표 텔레그램 봇

# 2026-10-01 구조 변경 — 왜
#   종전 '*/10 * * * *' 예약은 설정과 달리 실제로 하루 4~6번만 돌았다(2026-08-23~09-30 예약 실행 300건 실측: 연속 간격 중앙값 161분,
#   p90 333분, 최근 열흘 하루 4~6회). GitHub 는 잦은 예약을 부하 때 조용히 떨어뜨린다 — 한 번 돌면 20초 만에 끝나는 잡이라
#   오래 걸려서가 아니다. 그래서 '매시 한 번 깨워 55분 동안 5분마다 확인'하는 긴 잡으로 바꿨다. 하루 1회·매시 예약은 1~10분 안에
#   도는 것이 실측돼 있고(섹터 봇·사이트 시세 크론), 한 시간이 통째로 빠져도 다음 시간 잡이 지난 발표를 다 집어 보낸다
#   (캘린더는 ±1일 범위를 받고 sent_indicators.json 이 중복을 막는다).
# 중복 방지
#   · concurrency 로 같은 잡이 겹쳐 돌지 않는다(앞 잡이 끝날 때까지 뒤 잡은 대기).
#   · 발송 직후 매 회차 sent_indicators.json 을 커밋·푸시한다 — 잡이 중간에 죽어도 보낸 것은 기록돼 있다.
#   · 봇 자체가 실행 시작 때 파일을 읽고(load_sent) 보낸 것만 적으므로, 같은 잡 안의 다음 회차도 같은 지표를 다시 보내지 않는다.
on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: "몇 분 동안 돌릴지 (기본 55 · 한 번만 확인하려면 0)"
        required: false
        default: "55"
      every:
        description: "확인 간격(분)"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: econ-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install requests beautifulsoup4 cloudscraper

      - name: 봇 반복 실행 (5분 간격 · 발송마다 기록 커밋)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINUTES: ${{ github.event.inputs.minutes || '55' }}
          EVERY: ${{ github.event.inputs.every || '5' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          START=$(date +%s)
          END=$((START + MINUTES*60))
          while :; do
            echo "=== 회차 $(date -u +'%H:%M:%S') UTC ==="
            python econ_bot.py || echo "봇 실행 오류 — 다음 회차에 재시도"
            git add sent_indicators.json
            if ! git diff --staged --quiet; then
              git commit -m "Update sent indicators [skip ci]"
              for i in 1 2 3; do
                if git push; then break; fi
                git pull --rebase origin main || true
              done
            fi
            NOW=$(date +%s)
            if [ $((NOW + EVERY*60)) -gt $END ]; then break; fi
            sleep $((EVERY*60))
          done
