name: 진단 - 캘린더 덤프

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cloudscraper beautifulsoup4 requests
      - run: python diagnose.py
